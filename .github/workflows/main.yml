name: CI

on:
  push:
    branches:
      - "**"

jobs:
  php84:
    name: "php 8.4"
    runs-on: ubuntu-latest
    container: "nofutur3/php-tests:8.4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: phive install --trust-gpg-keys E82B2FB314E9906E,4AA394086372C20A

      - name: Chesk code style
        run: tools/php-cs-fixer fix --dry-run --no-interaction

      - name: Install dependencies
        run: composer update --no-interaction --prefer-lowest --with symfony/lock:^7.0 --with simple-as-fuck/php-validator:^0.7.0 --with illuminate/contracts:^12.0

      - name: Run static analysis
        run: vendor/bin/phpstan analyse

      - name: Run tests
        run: vendor/bin/phpunit test/

  php83:
    name: "php 8.3"
    runs-on: ubuntu-latest
    container: "nofutur3/php-tests:8.3"
    steps:
